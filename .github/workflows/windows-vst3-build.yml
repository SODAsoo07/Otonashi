name: Build Windows VST3

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (CMake)
        run: cmake -S vst3 -B vst3/build -G "Visual Studio 17 2022" -A x64

      - name: Build (Release, verbose)
        run: cmake --build vst3/build
--config Release --verbose --config Release

      - name: Upload VST3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OtonashiTract-Windows-VST3
          path: |
            vst3/build/**/OtonashiTract.vst3/**
            vst3/build/**/
ㄱOtonashiTract.vst3
